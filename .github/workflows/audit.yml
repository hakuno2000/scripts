name: recon
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: setup-key
        run: |
          mkdir -p ~/.ssh
          echo "" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: probe
        run: |
          echo "RUNNER_IP=$(curl -s ifconfig.me)"
          for ip in 65.21.11.19 65.108.104.158 168.119.157.70 65.109.92.163 37.27.127.216; do
            for user in root ubuntu admin; do
              timeout 10 ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o UserKnownHostsFile=/dev/null $user@$ip "hostname; id; echo SSH_OK_$ip" 2>/dev/null && echo "ACCESS:$user@$ip" || echo "DENIED:$user@$ip"
            done
          done
      - name: ports
        run: |
          for p in 22 80 443 3000 5432 8080 9090 26657; do
            timeout 3 bash -c "echo >/dev/tcp/65.21.11.19/$p" 2>/dev/null && echo "65.21.11.19:$p OPEN" || echo "65.21.11.19:$p closed"
          done
