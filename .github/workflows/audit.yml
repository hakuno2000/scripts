name: audit
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: System info
        run: |
          echo "Runner: $(hostname)"
          echo "IP: $(curl -s ifconfig.me)"
          echo "User: $(whoami)"
          id
          uname -a
          env | sort
